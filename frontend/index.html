<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGII - Acceso Seguro | Innovatech Solutions</title>
    <meta name="description" content="Sistema de Gestión Integrado Innovatech. Autenticación JWT con control de acceso basado en roles (RBAC).">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">🚀</div>
                <h1>SGII</h1>
                <p>Sistema de Gestión Integrado Innovatech</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario o Email</label>
                    <input type="text" id="username" placeholder="tu@innovatech.com" value="ana.garcia@innovatech.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" value="••••••••">
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);cursor:pointer;margin:0;">
                        <input type="checkbox" checked style="width:auto;accent-color:var(--primary);"> Recordarme
                    </label>
                    <a href="#" style="font-size:13px;color:var(--primary-light);text-decoration:none;">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">Iniciar Sesión</button>

                <div style="display:flex;align-items:center;gap:12px;margin:20px 0;">
                    <div style="flex:1;height:1px;background:var(--border);"></div>
                    <span style="font-size:12px;color:var(--text-muted);">o continúa con</span>
                    <div style="flex:1;height:1px;background:var(--border);"></div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;">
                    <button type="button" class="btn-secondary" onclick="alert('SSO Microsoft configurado')">
                        🏢 Microsoft SSO
                    </button>
                    <button type="button" class="btn-secondary" onclick="alert('SSO Google configurado')">
                        🔵 Google
                    </button>
                </div>

                <p class="register-link">¿No tienes cuenta? <a href="#" onclick="showRegister(); return false;">Regístrate aquí</a></p>
            </form>

            <!-- Register Form (hidden) -->
            <form id="registerForm" style="display:none;">
                <div class="form-group">
                    <label for="reg-fullname">Nombre Completo</label>
                    <input type="text" id="reg-fullname" placeholder="Tu nombre completo">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Corporativo</label>
                    <input type="email" id="reg-email" placeholder="tu@innovatech.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-username">Nombre de Usuario</label>
                    <input type="text" id="reg-username" placeholder="usuario.nombre" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Mín. 8 caracteres con símbolo" required>
                </div>
                <button type="submit" class="btn-primary">Crear Cuenta</button>
                <p class="register-link">¿Ya tienes cuenta? <a href="#" onclick="showLogin(); return false;">Inicia sesión aquí</a></p>
            </form>

            <!-- Security Badges -->
            <div style="display:flex;justify-content:center;gap:16px;margin-top:24px;flex-wrap:wrap;">
                <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);">
                    🔐 <span>JWT Seguro</span>
                </div>
                <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);">
                    🛡️ <span>GDPR Compliant</span>
                </div>
                <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);">
                    🔒 <span>AES-256</span>
                </div>
                <div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);">
                    ✅ <span>2FA Activado</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/demo.js"></script>
    <script>
        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const userVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;

            btn.textContent = '⏳ Verificando...';
            btn.disabled = true;

            try {
                // El login del backend requiere OAuth2 Form URL Encoded
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 'username': userVal, 'password': passVal })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);

                    // Obtener perfil del usuario
                    const userResponse = await fetch('http://localhost:8000/api/auth/me', {
                        headers: { 'Authorization': `Bearer ${data.access_token}` }
                    });
                    if (userResponse.ok) {
                        const userData = await userResponse.json();
                        localStorage.setItem('user', JSON.stringify(userData));
                    } else {
                        localStorage.setItem('user', JSON.stringify({ username: userVal, role: 'manager', full_name: 'Ana García' }));
                    }

                    window.location.href = 'dashboard.html';
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.detail || 'Credenciales incorrectas'));
                    btn.textContent = 'Iniciar Sesión';
                    btn.disabled = false;
                }
            } catch (error) {
                console.warn('Backend offline, usando modo demostración local.', error);
                // Fallback local en caso de desconexión
                if (userVal && passVal) {
                    localStorage.setItem('access_token', 'demo-token-jwt-12345');
                    localStorage.setItem('user', JSON.stringify({ username: 'ana.garcia', role: 'manager', full_name: 'Ana García' }));
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Por favor ingresa usuario y contraseña');
                    btn.textContent = 'Iniciar Sesión';
                    btn.disabled = false;
                }
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const full_name = document.getElementById('reg-fullname').value;
            const password = document.getElementById('reg-password').value;

            try {
                const response = await fetch('http://localhost:8000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, full_name, password, role: 'dev' })
                });

                if (response.ok) {
                    alert('✅ Usuario registrado exitosamente en la base de datos.');
                    showLogin();
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.detail || 'No se pudo registrar'));
                }
            } catch (error) {
                alert('Modo demostración: cuenta simulada.');
                showLogin();
            }
        });
    </script>
</body>
</html>
